dist: trusty

language: python

python:
  - "2.7"

before_install:
  - sudo apt-get update
  # - sudo apt-get install language-pack-UTF-8
  - sudo apt-get install -y debhelper
  - sudo apt-get install -y pylint python-tz python-passlib 
  - sudo apt-get install -y python-dateutil python-boto python-crypto
  - sudo apt-get install -y python-mako python-webob python-pastescript 
  - sudo apt-get install -y python-sqlalchemy python-paste python-pastedeploy
  - sudo apt-get install -y git
  - curl -sL https://deb.nodesource.com/setup_4.x | sudo -E bash -
  - sudo apt-get install -y nodejs
  - sudo apt-get install -y unzip wget
  - wget https://s3.amazonaws.com/versions-palette-software/akiri.framework_0.5.6_all.deb
  - sudo dpkg --install akiri.framework_0.5.6_all.deb
  - sudo npm install grunt -g
  - pip install --upgrade pip
  - pip install python-dateutil

install:
  - echo $PWD
  - ls -ltr
  - pushd app
  - make setup
  - popd

script:
  - make palette
  - ls -ltr
  - ls -ltr dpkg/pool
  - make controller
  - ls -ltr
  - ls -ltr dpkg/pool
    # - make clean all
  - GNUPGHOME=dpkg/keys reprepro -b dpkg/apt includedeb stable dpkg/pool/*.deb
  - chmod 600 dpkg/client/id_rsa
  - cd dpkg/apt
  - echo "54.209.53.120 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBFb0QGqwwyiwlSJ2kfOi+XavgQEuE15dGDMwy9Trl69Aoj2JA9DtfEYhixb4lKmD/3XPulajWuuzIhMvXEQJ1LE=" > ~/.ssh/known_hosts
  - scp -r -i ../client/id_rsa -r . ubuntu@54.209.53.120:/var/packages/dev

