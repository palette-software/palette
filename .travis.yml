install:
  - pushd app
  - make setup
  - popd

after_success:
  # # Prepare the zip file for Github release
  # - zip -r palette-${TRAVIS_TAG}.zip ~/dpkg/apt

  # Create the zip package fo GoCD
  - export PCKG_FILE=palette-${PALETTE_VERSION}.zip
  - zip -r $PCKG_FILE dpkg/apt

  # Only deploy to GoCD server from the origin/cen-13/ci-alternative!!! branch (temporarily)
  - test $TRAVIS_BRANCH = "origin/cen-13/ci-alternative" &&
    $TRAVIS_BUILD_DIR/release-to-github.sh

script:
  - make palette
  - make controller
    # - make clean all
  - GNUPGHOME=dpkg/keys reprepro -b dpkg/apt includedeb stable dpkg/pool/*.deb

